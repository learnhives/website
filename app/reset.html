<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — LearnHives</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --honey:#F5A623; --amber:#E8850A; --dark:#3B2A00; --soft:#FFF8E7; --comb:#FFF3D0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Nunito',sans-serif; background:var(--soft); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:white; border-radius:32px; padding:2.5rem 2rem; width:100%; max-width:420px; box-shadow:0 12px 40px rgba(0,0,0,0.1); border-top:5px solid var(--honey); }
  .logo { font-family:'Fredoka One',cursive; font-size:1.8rem; color:var(--amber); text-align:center; margin-bottom:0.25rem; }
  .subtitle { text-align:center; color:#888; font-size:0.95rem; margin-bottom:2rem; }
  .form-group { margin-bottom:1.2rem; }
  label { display:block; font-weight:700; font-size:0.9rem; color:var(--dark); margin-bottom:0.4rem; }
  input { width:100%; padding:0.8rem 1rem; border:2px solid #E5E5E5; border-radius:12px; font-family:'Nunito',sans-serif; font-size:1rem; transition:border-color 0.2s; outline:none; }
  input:focus { border-color:var(--honey); }
  .btn { width:100%; padding:0.9rem; background:var(--honey); color:white; border:none; border-radius:50px; font-family:'Nunito',sans-serif; font-weight:800; font-size:1.1rem; cursor:pointer; transition:opacity 0.2s; margin-top:0.5rem; }
  .btn:hover { opacity:0.9; }
  .btn:disabled { opacity:0.6; cursor:not-allowed; }
  .back-link { text-align:center; font-size:0.95rem; color:#666; margin-top:1.2rem; }
  .back-link a { color:var(--amber); font-weight:700; text-decoration:none; }
  .error { background:#FFE5E5; color:#C0392B; padding:0.75rem 1rem; border-radius:12px; font-size:0.9rem; margin-bottom:1rem; display:none; }
  .success { background:#E5FFE9; color:#1D6A3A; padding:0.75rem 1rem; border-radius:12px; font-size:0.9rem; margin-bottom:1rem; display:none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🐝 LearnHives</div>
  <p class="subtitle">Reset your password</p>
  <div class="error" id="errorMsg"></div>
  <div class="success" id="successMsg"></div>
  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" />
  </div>
  <button class="btn" id="resetBtn" onclick="handleReset()">🍯 Send Reset Link</button>
  <p class="back-link"><a href="/app/login.html">← Back to login</a></p>
</div>

<script>
  const SUPABASE_URL = 'https://oyipfnllzdvauxmbcshx.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_NWbXbpid0odCmxHj2UTcrw_3jxtcQ2B'
  const { createClient } = supabase
  const db = createClient(SUPABASE_URL, SUPABASE_KEY)

  async function handleReset() {
    const email = document.getElementById('email').value.trim()
    const btn = document.getElementById('resetBtn')
    const errorEl = document.getElementById('errorMsg')
    const successEl = document.getElementById('successMsg')

    errorEl.style.display = 'none'
    successEl.style.display = 'none'

    if (!email) { errorEl.textContent = 'Please enter your email.'; errorEl.style.display = 'block'; return }

    btn.disabled = true
    btn.textContent = '⏳ Sending...'

    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://www.learnhives.com/app/update-password.html'
    })

    if (error) {
      errorEl.textContent = error.message
      errorEl.style.display = 'block'
      btn.disabled = false
      btn.textContent = '🍯 Send Reset Link'
      return
    }

    successEl.textContent = '🎉 Check your email for the reset link!'
    successEl.style.display = 'block'
    btn.textContent = '✅ Email sent!'
  }
</script>
</body>
</html>
