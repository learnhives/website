<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Hive — LearnHives Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --honey: #F5A623; --amber: #E8850A; --dark: #3B2A00;
    --soft: #FFF8E7; --comb: #FFF3D0; --white: #FFFDF5;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Nunito',sans-serif; background:var(--soft); min-height:100vh; }

  /* NAV */
  nav {
    background:white; padding:1rem 2rem;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 20px rgba(0,0,0,0.07);
    border-bottom:3px solid var(--honey);
  }
  .logo { font-family:'Fredoka One',cursive; font-size:1.5rem; color:var(--amber); }
  .nav-right { display:flex; align-items:center; gap:1rem; }
  .user-name { font-weight:700; color:var(--dark); font-size:0.95rem; }
  .logout-btn {
    background:none; border:2px solid #E5E5E5; border-radius:50px;
    padding:0.4rem 1rem; cursor:pointer; font-family:'Nunito',sans-serif;
    font-size:0.85rem; font-weight:700; color:#888;
    transition:border-color 0.2s;
  }
  .logout-btn:hover { border-color:var(--amber); color:var(--amber); }

  /* MAIN */
  .container { max-width:900px; margin:0 auto; padding:2rem 1.5rem; }
  .welcome { font-family:'Fredoka One',cursive; font-size:2rem; color:var(--dark); margin-bottom:0.5rem; }
  .welcome-sub { color:#888; font-size:1rem; margin-bottom:2rem; }

  /* TRIAL BANNER */
  .trial-banner {
    background:linear-gradient(135deg,var(--honey),var(--amber));
    border-radius:20px; padding:1.25rem 1.5rem;
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:2rem; flex-wrap:wrap; gap:1rem;
  }
  .trial-text { color:white; font-weight:700; font-size:1rem; }
  .trial-sub { color:rgba(255,255,255,0.85); font-size:0.85rem; margin-top:2px; }
  .upgrade-btn {
    background:white; color:var(--amber); border:none;
    padding:0.6rem 1.4rem; border-radius:50px;
    font-family:'Nunito',sans-serif; font-weight:800;
    font-size:0.9rem; cursor:pointer; transition:transform 0.2s;
  }
  .upgrade-btn:hover { transform:scale(1.05); }

  /* CHILDREN */
  .section-title {
    font-family:'Fredoka One',cursive; font-size:1.4rem;
    color:var(--dark); margin-bottom:1rem;
  }
  .children-grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:1.5rem; margin-bottom:2rem;
  }
  .child-card {
    background:white; border-radius:24px; padding:1.5rem;
    text-align:center; box-shadow:0 4px 16px rgba(0,0,0,0.07);
    border:2px solid var(--comb); cursor:pointer;
    transition:transform 0.2s, box-shadow 0.2s;
  }
  .child-card:hover { transform:translateY(-4px); box-shadow:0 8px 24px rgba(0,0,0,0.12); }
  .child-emoji { font-size:3rem; display:block; margin-bottom:0.75rem; }
  .child-name { font-weight:800; font-size:1.1rem; color:var(--dark); margin-bottom:0.25rem; }
  .child-age { font-size:0.85rem; color:#888; margin-bottom:0.75rem; }
  .start-btn {
    background:var(--honey); color:white; border:none;
    padding:0.5rem 1.2rem; border-radius:50px;
    font-family:'Nunito',sans-serif; font-weight:700;
    font-size:0.85rem; cursor:pointer; transition:opacity 0.2s;
  }
  .start-btn:hover { opacity:0.85; }

  /* ADD CHILD */
  .add-child-card {
    background:var(--comb); border-radius:24px; padding:1.5rem;
    text-align:center; border:2px dashed var(--honey);
    cursor:pointer; transition:background 0.2s;
  }
  .add-child-card:hover { background:#FFE8A0; }
  .add-icon { font-size:2.5rem; display:block; margin-bottom:0.5rem; }
  .add-text { font-weight:800; color:var(--amber); font-size:1rem; }

  /* ADD CHILD FORM */
  .modal-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.5); z-index:100;
    align-items:center; justify-content:center;
  }
  .modal-overlay.show { display:flex; }
  .modal {
    background:white; border-radius:24px; padding:2rem;
    width:100%; max-width:400px; margin:1rem;
  }
  .modal-title { font-family:'Fredoka One',cursive; font-size:1.5rem; color:var(--dark); margin-bottom:1.5rem; }
  .form-group { margin-bottom:1rem; }
  label { display:block; font-weight:700; font-size:0.9rem; color:var(--dark); margin-bottom:0.4rem; }
  input, select {
    width:100%; padding:0.75rem 1rem; border:2px solid #E5E5E5;
    border-radius:12px; font-family:'Nunito',sans-serif;
    font-size:1rem; outline:none; transition:border-color 0.2s;
  }
  input:focus, select:focus { border-color:var(--honey); }
  .character-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.5rem; }
  .char-btn {
    background:var(--soft); border:2px solid #E5E5E5;
    border-radius:12px; padding:0.5rem; cursor:pointer;
    text-align:center; font-size:1.5rem; transition:all 0.2s;
  }
  .char-btn.selected { border-color:var(--honey); background:var(--comb); }
  .modal-btns { display:flex; gap:0.75rem; margin-top:1.5rem; }
  .btn-cancel {
    flex:1; padding:0.75rem; border:2px solid #E5E5E5;
    border-radius:50px; background:none; cursor:pointer;
    font-family:'Nunito',sans-serif; font-weight:700; color:#888;
  }
  .btn-save {
    flex:2; padding:0.75rem; background:var(--honey);
    border:none; border-radius:50px; color:white;
    font-family:'Nunito',sans-serif; font-weight:800;
    font-size:1rem; cursor:pointer;
  }

  /* LOADING */
  .loading { text-align:center; padding:3rem; color:#888; font-size:1.1rem; }
</style>
</head>
<body>

<nav>
  <div class="logo">🐝 LearnHives</div>
  <div class="nav-right">
    <span class="user-name" id="userName">Loading...</span>
    <button class="logout-btn" onclick="handleLogout()">Log out</button>
  </div>
</nav>

<div class="container">
  <div id="loadingState" class="loading">🐝 Loading your hive...</div>

  <div id="dashboardContent" style="display:none;">
    <h1 class="welcome" id="welcomeMsg">Welcome back! 🍯</h1>
    <p class="welcome-sub">Pick a child to start learning today.</p>

    <div class="trial-banner">
      <div>
        <div class="trial-text">🍯 Your free trial is active!</div>
        <div class="trial-sub" id="trialDays">30 days remaining</div>
      </div>
      <button class="upgrade-btn">Upgrade to Family Plan</button>
    </div>

    <h2 class="section-title">Your Little Bees 🐝</h2>
    <div class="children-grid" id="childrenGrid">
      <div class="add-child-card" onclick="showAddChild()">
        <span class="add-icon">➕</span>
        <div class="add-text">Add a child</div>
      </div>
    </div>
  </div>
</div>

<!-- ADD CHILD MODAL -->
<div class="modal-overlay" id="addChildModal">
  <div class="modal">
    <div class="modal-title">Add a Little Bee 🐝</div>
    <div class="form-group">
      <label>Child's Name</label>
      <input type="text" id="childName" placeholder="e.g. Emma" />
    </div>
    <div class="form-group">
      <label>Age</label>
      <select id="childAge">
        <option value="2">2 years old</option>
        <option value="3">3 years old</option>
        <option value="4" selected>4 years old</option>
        <option value="5">5 years old</option>
        <option value="6">6 years old</option>
      </select>
    </div>
    <div class="form-group">
      <label>Choose a Character</label>
      <div class="character-grid">
        <div class="char-btn selected" data-char="buzz" onclick="selectChar(this)">🐝<br><small>Buzz</small></div>
        <div class="char-btn" data-char="honey" onclick="selectChar(this)">🍯<br><small>Honey</small></div>
        <div class="char-btn" data-char="flora" onclick="selectChar(this)">🌸<br><small>Flora</small></div>
        <div class="char-btn" data-char="petal" onclick="selectChar(this)">🌿<br><small>Petal</small></div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="hideAddChild()">Cancel</button>
      <button class="btn-save" onclick="saveChild()">Add to Hive 🐝</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://oyipfnllzdvauxmbcshx.supabase.co'
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95aXBmbmxsemR2YXV4bWJjc2h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTYzNjMsImV4cCI6MjA5NjE3MjM2M30.Ld5-fk_dOVcc7y_pJ3DFOXglNOlEFLpQI1qMLyXP-i0'
  const { createClient } = supabase
  const db = createClient(SUPABASE_URL, SUPABASE_KEY)

  const CHAR_EMOJIS = { buzz:'🐝', honey:'🍯', flora:'🌸', petal:'🌿' }
  let selectedChar = 'buzz'
  let currentUser = null

  // ── Init ──────────────────────────────────────────
  async function init() {
    const { data: { session } } = await db.auth.getSession()
    if (!session) {
      window.location.href = '/app/login.html'
      return
    }
    currentUser = session.user
    document.getElementById('userName').textContent = currentUser.user_metadata?.full_name || currentUser.email
    document.getElementById('welcomeMsg').textContent = `Welcome, ${currentUser.user_metadata?.full_name?.split(' ')[0] || 'Parent'}! 🍯`
    document.getElementById('loadingState').style.display = 'none'
    document.getElementById('dashboardContent').style.display = 'block'
    loadChildren()
  }

  // ── Load children ─────────────────────────────────
  async function loadChildren() {
    const { data: children } = await db
      .from('children')
      .select('*')
      .order('created_at', { ascending: true })

    const grid = document.getElementById('childrenGrid')
    grid.innerHTML = ''

    children?.forEach(child => {
      const card = document.createElement('div')
      card.className = 'child-card'
      card.innerHTML = `
        <span class="child-emoji">${CHAR_EMOJIS[child.character] || '🐝'}</span>
        <div class="child-name">${child.name}</div>
        <div class="child-age">${child.age} years old</div>
        <button class="start-btn">Start Learning 🍯</button>
      `
      grid.appendChild(card)
    })

    // Add child button
    const addCard = document.createElement('div')
    addCard.className = 'add-child-card'
    addCard.onclick = showAddChild
    addCard.innerHTML = `<span class="add-icon">➕</span><div class="add-text">Add a child</div>`
    grid.appendChild(addCard)
  }

  // ── Add child ─────────────────────────────────────
  function showAddChild() { document.getElementById('addChildModal').classList.add('show') }
  function hideAddChild() { document.getElementById('addChildModal').classList.remove('show') }

  function selectChar(el) {
    document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'))
    el.classList.add('selected')
    selectedChar = el.dataset.char
  }

  async function saveChild() {
    const name = document.getElementById('childName').value.trim()
    const age  = parseInt(document.getElementById('childAge').value)
    if (!name) { alert('Please enter the child\'s name!'); return }

    const { error } = await db.from('children').insert({
      parent_id: currentUser.id,
      name, age,
      character: selectedChar
    })

    if (error) { alert('Error: ' + error.message); return }
    hideAddChild()
    document.getElementById('childName').value = ''
    loadChildren()
  }

  // ── Logout ────────────────────────────────────────
  async function handleLogout() {
    await db.auth.signOut()
    window.location.href = '/'
  }

  init()
</script>
</body>
</html>
